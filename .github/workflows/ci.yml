name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  VCPKG_COMMIT: 2750401336fb7c95f6619657a46a7e798661341c
  CLANG_FORMAT_VERSION: 18.1.8

jobs:
  format:
    name: Format check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install clang-format
        run: pip install clang-format==${{ env.CLANG_FORMAT_VERSION }}
      - name: Check formatting
        run: |
          find engine plugins -name '*.cpp' -o -name '*.hpp' -o -name '*.tpp' \
            | xargs clang-format --style=file --dry-run --Werror

  build:
    name: Build ${{ matrix.os }}
    needs: format
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    env:
      VCPKG_ROOT: ${{ github.workspace }}/.vcpkg
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/.vcpkg-cache,readwrite
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config libx11-dev libxrandr-dev libxcursor-dev libxi-dev \
            libudev-dev libgl1-mesa-dev autoconf autoconf-archive automake libtool

      - name: Restore vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.vcpkg-cache
          key: vcpkg-${{ matrix.os }}-${{ env.VCPKG_COMMIT }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-${{ matrix.os }}-${{ env.VCPKG_COMMIT }}-

      - name: Set up vcpkg
        shell: bash
        run: |
          mkdir -p .vcpkg-cache
          git clone https://github.com/microsoft/vcpkg.git .vcpkg
          git -C .vcpkg checkout ${{ env.VCPKG_COMMIT }}
          if [ "$RUNNER_OS" = "Windows" ]; then ./.vcpkg/bootstrap-vcpkg.bat -disableMetrics; else ./.vcpkg/bootstrap-vcpkg.sh -disableMetrics; fi

      - name: Configure (Linux)
        if: runner.os == 'Linux'
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE=.vcpkg/scripts/buildsystems/vcpkg.cmake

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DCMAKE_TOOLCHAIN_FILE=.vcpkg/scripts/buildsystems/vcpkg.cmake

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Smoke test (server starts)
        if: runner.os == 'Linux'
        run: |
          timeout 3 ./build/bin/r-type_server -p 4242 || test $? -eq 124

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: rtype-${{ matrix.os }}
          path: |
            build/bin/
            !build/bin/**/*.pdb
          retention-days: 7
